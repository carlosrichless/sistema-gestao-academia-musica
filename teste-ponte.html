<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste da Ponte — Academia</title><style>body{font:17px system-ui;background:#111827;color:#fff;max-width:680px;margin:50px auto;padding:20px}#status{padding:22px;border:1px solid #64748b;border-radius:12px;line-height:1.6}iframe{display:none}</style></head><body><h1>Teste da Ponte — Academia</h1><p>Este teste não pede senhas e não altera dados.</p><div id="status">Aguardando a ponte...</div><iframe id="bridge" title="Ponte" src="https://script.google.com/macros/s/AKfycbzhighHkjPt7w35RGulC1wKUIilHeLyQiwVle4SzMt1qJ4M2xrn3PrzQgOX1D2rS50LBA/exec?bridge=1"></iframe><script>
const status=document.getElementById('status'),frame=document.getElementById('bridge');let seq=1,done=false;
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||!/^https:\/\/(script\.google\.com|[a-z0-9.-]+\.googleusercontent\.com)$/.test(e.origin))return;if(e.data?.type==='academia-ready'){status.textContent='Ponte carregada. Testando resposta do servidor...';frame.contentWindow.postMessage({type:'academia-request',id:seq,request:{action:'ping'}},'*')}else if(e.data?.type==='academia-response'&&e.data.id===seq){done=true;const ok=e.data.result?.ok===true&&e.data.result?.status==='online';status.textContent=ok?'SUCESSO: GitHub e Apps Script estão se comunicando.':'RESPOSTA INESPERADA: '+JSON.stringify(e.data.result);status.style.borderColor=ok?'#22c55e':'#ef4444'}});
setTimeout(()=>{if(!done)status.textContent+=' Se não aparecer sucesso, envie uma captura desta tela e do Console (F12).'},15000);
</script></body></html>
